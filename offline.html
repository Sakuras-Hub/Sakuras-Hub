<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06060d">
<title>You are offline · Sakura’s Hub</title>
<style>
:root{color-scheme:dark light;--bg:#06060d;--text:#e8eaf6;--muted:#9e94c0;--accent:#ff9ec4}
@media (prefers-color-scheme:light){:root{--bg:#f7f5fb;--text:#1d1830;--muted:#6a5f8c;--accent:#c01f75}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px}
main{max-width:420px}
h1{font-size:1.6rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 20px}
button{font:700 1rem inherit;padding:11px 22px;border-radius:999px;border:0;background:var(--accent);color:#16101f;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🌸 You are offline</h1>
  <p>Sakura’s Hub could not reach the internet. Pages you opened before still work. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
