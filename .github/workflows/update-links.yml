name: Update links from databases

on:
  schedule:
    # daily, 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-links
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge new sites from source databases
        run: python scripts/updater.py --merge

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- 'need for the website to work/info.json'; then
            echo "no changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- 'need for the website to work/info.json'
            git commit -m 'chore: auto-grab new sites from databases'
            git push origin HEAD:main
          fi